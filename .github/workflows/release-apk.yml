name: Build & Publish Release APK

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release version tag (e.g. v1.0.0)"
        required: true
        default: "v1.0.0"

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build Signed Android APK & Publish GitHub Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Prepare environment and keystore
        shell: bash
        run: |
          if [ ! -f .env ] && [ -f .env.example ]; then
            cp .env.example .env
          fi
          if [ -f debug.keystore.base64 ] && [ ! -f debug.keystore ]; then
            base64 --decode debug.keystore.base64 > debug.keystore
          fi

      - name: Run Unit & Robolectric Tests
        run: gradle :app:testDebugUnitTest --no-daemon --stacktrace

      - name: Determine Release Tag & Signing Mode
        id: meta
        shell: bash
        env:
          HAS_RELEASE_KEYSTORE: ${{ secrets.KEYSTORE_BASE64 != '' && secrets.STORE_PASSWORD != '' && secrets.KEY_PASSWORD != '' }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.release_tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "use_release_signing=${HAS_RELEASE_KEYSTORE}" >> "$GITHUB_OUTPUT"

      - name: Decode Release Keystore (if configured)
        if: steps.meta.outputs.use_release_signing == 'true'
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > my-upload-key.jks

      - name: Build Signed Release APK
        if: steps.meta.outputs.use_release_signing == 'true'
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Build Installable Signed APK (Default Keystore)
        if: steps.meta.outputs.use_release_signing != 'true'
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Package APK & SHA-256 Checksum
        shell: bash
        run: |
          TAG="${{ steps.meta.outputs.tag }}"
          mkdir -p release-assets
          if [ "${{ steps.meta.outputs.use_release_signing }}" = "true" ]; then
            SRC_APK="app/build/outputs/apk/release/app-release.apk"
          else
            SRC_APK="app/build/outputs/apk/debug/app-debug.apk"
          fi
          DEST_APK="release-assets/AntigravityPulse-${TAG}.apk"
          cp "$SRC_APK" "$DEST_APK"
          (cd release-assets && sha256sum "AntigravityPulse-${TAG}.apk" > "AntigravityPulse-${TAG}.apk.sha256")
          ls -lh release-assets

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AntigravityPulse-${{ steps.meta.outputs.tag }}
          path: release-assets/*

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: Antigravity Pulse ${{ steps.meta.outputs.tag }}
          generate_release_notes: true
          body: |
            ## Antigravity Pulse ${{ steps.meta.outputs.tag }}

            ### Direct Phone Installation
            1. Tap **`AntigravityPulse-${{ steps.meta.outputs.tag }}.apk`** below on your Android phone (Android 7.0+ / API 24+).
            2. Open the downloaded file and allow installation from your browser if prompted.
            3. Launch **Antigravity Pulse** and use the translucent side handle to scan your QR code or enter your remote URL.

            ### Verification
            Compare the downloaded APK against `AntigravityPulse-${{ steps.meta.outputs.tag }}.apk.sha256`.

            ---
            Maintained by **Solomon Ogar Bukie** ([@IceCool30](https://github.com/IceCool30)).
          files: |
            release-assets/AntigravityPulse-${{ steps.meta.outputs.tag }}.apk
            release-assets/AntigravityPulse-${{ steps.meta.outputs.tag }}.apk.sha256
