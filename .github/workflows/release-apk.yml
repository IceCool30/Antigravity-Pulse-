name: Build & Publish Release APK

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release version tag (e.g. v1.1.0)"
        required: false
        default: "v1.1.0"

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build Android APK & Publish GitHub Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Prepare environment and keystores
        shell: bash
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ ! -f .env ] && [ -f .env.example ]; then
            cp .env.example .env
          fi
          if [ ! -f debug.keystore ]; then
            if [ -n "${DEBUG_KEYSTORE_BASE64:-}" ]; then
              printf '%s' "$DEBUG_KEYSTORE_BASE64" | base64 --decode > debug.keystore
            else
              keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
            fi
          fi

      - name: Run Unit & Robolectric Tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace

      - name: Determine Release Tag & Signing Mode
        id: meta
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG_INPUT: ${{ github.event.inputs.release_tag }}
          HAS_RELEASE_KEYSTORE: ${{ (secrets.ANDROID_KEYSTORE_BASE64 != '' || secrets.KEYSTORE_BASE64 != '') && secrets.STORE_PASSWORD != '' && secrets.KEY_PASSWORD != '' }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            TAG="${RELEASE_TAG_INPUT:-v1.1.0}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.]+)?$ ]]; then
            echo "::error::Invalid release tag format: must match vX.Y.Z (e.g. v1.1.0)"
            exit 1
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "use_release_signing=${HAS_RELEASE_KEYSTORE}" >> "$GITHUB_OUTPUT"

      - name: Decode Release Keystore (if configured)
        if: steps.meta.outputs.use_release_signing == 'true'
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 || secrets.KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > my-upload-key.jks

      - name: Build Signed Release APK
        if: steps.meta.outputs.use_release_signing == 'true'
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Build Installable Signed APK (Universal Keystore)
        if: steps.meta.outputs.use_release_signing != 'true'
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Package APK & Generate SHA-256
        shell: bash
        env:
          TAG: ${{ steps.meta.outputs.tag }}
          USE_RELEASE_SIGNING: ${{ steps.meta.outputs.use_release_signing }}
        run: |
          mkdir -p release-artifacts
          if [ "$USE_RELEASE_SIGNING" = "true" ]; then
            SRC_APK="app/build/outputs/apk/release/app-release.apk"
          else
            SRC_APK="app/build/outputs/apk/debug/app-debug.apk"
          fi
          DEST_APK="release-artifacts/Antigravity-Pulse-${TAG}.apk"
          cp "$SRC_APK" "$DEST_APK"
          cd release-artifacts
          sha256sum "Antigravity-Pulse-${TAG}.apk" > SHA256SUMS.txt
          ls -lh

      - name: Clean Up Ephemeral Keystores
        if: always()
        shell: bash
        run: |
          rm -f my-upload-key.jks debug.keystore

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Antigravity-Pulse-${{ steps.meta.outputs.tag }}
          path: release-artifacts/*

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: Antigravity Pulse ${{ steps.meta.outputs.tag }}
          body_path: RELEASE_NOTES.md
          files: |
            release-artifacts/Antigravity-Pulse-${{ steps.meta.outputs.tag }}.apk
            release-artifacts/SHA256SUMS.txt
